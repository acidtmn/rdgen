name: Custom Windows x86 Portable Generator
run-name: Custom Windows x86 Portable Generator

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RustDesk source tag"
        required: true
        default: "1.4.9"
        type: string
      zip_url:
        description: "URL to encrypted generator configuration"
        required: false
        default: ""
        type: string
      config_b64:
        description: "Base64-encoded private generator configuration"
        required: false
        default: ""
        type: string

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "${{ inputs.version }}"

jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}
      config_b64: ${{ inputs.config_b64 }}
    secrets: inherit

  build-x86:
    name: Windows x86 portable
    needs: setup
    runs-on: windows-2022
    steps:
      - name: Checkout generator repository
        uses: actions/checkout@v4

      - name: Download encrypted configuration
        uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load private configuration
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ inputs.version }}
          submodules: recursive

      - name: Apply Russian distribution defaults
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/patches"
          Invoke-WebRequest -Uri "$base/apply_russian_distribution.py" -OutFile apply_russian_distribution.py
          python apply_russian_distribution.py

      - name: Apply Tehpult account and address-book integration
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/patches"
          Invoke-WebRequest -Uri "$base/apply_nanodesk_client_auth.py" -OutFile apply_nanodesk_client_auth.py
          Invoke-WebRequest -Uri "$base/nanodesk_client_auth.tis" -OutFile nanodesk_client_auth.tis
          python apply_nanodesk_client_auth.py --template nanodesk_client_auth.tis

      - name: Configure Tehpult Sciter client
        shell: pwsh
        run: |
          $scriptUrl = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/scripts/configure_tehpult_sciter.py"
          Invoke-WebRequest -Uri $scriptUrl -OutFile configure_tehpult_sciter.py
          python configure_tehpult_sciter.py

      - name: Install ImageMagick
        shell: pwsh
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" |
            ForEach-Object { $_.FullName } |
            Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" |
            Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Apply Tehpult branding to source
        shell: pwsh
        run: |
          $scriptUrl = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/scripts/apply_windows_branding.ps1"
          Invoke-WebRequest -Uri $scriptUrl -OutFile apply_windows_branding.ps1
          ./apply_windows_branding.ps1 `
            -RepositoryRoot (Get-Location).Path `
            -IconBaseUrl '${{ env.iconlink_url }}' `
            -IconUuid '${{ env.iconlink_uuid }}' `
            -IconFileName '${{ env.iconlink_file }}' `
            -LogoBaseUrl '${{ env.logolink_url }}' `
            -LogoUuid '${{ env.logolink_uuid }}' `
            -LogoFileName '${{ env.logolink_file }}' `
            -BrandName '${{ env.appname }}'

      - name: Replace embedded tray icon
        shell: pwsh
        run: |
          $scriptUrl = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/patches/replace_ui_rs_icon.py"
          Invoke-WebRequest -Uri $scriptUrl -OutFile replace_ui_rs_icon.py
          python replace_ui_rs_icon.py --ui-rs ./src/ui.rs --image ./.rdgen-branding/icon.png

      - name: Install 32-bit LLVM and Clang
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install 32-bit Rust toolchain
        shell: bash
        run: |
          # Sciter использует abi_thiscall, поэтому нужен проверенный i686 nightly из официального workflow.
          rustup toolchain install nightly-2023-10-13-i686-pc-windows-msvc \
            --target i686-pc-windows-msvc \
            --component rustfmt \
            --profile minimal \
            --no-self-update \
            --force-non-host
          rustup default nightly-2023-10-13-i686-pc-windows-msvc --force-non-host

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-sciter-x86

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install x86 native dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x86-windows-static
        run: |
          install_succeeded=false
          for attempt in 1 2 3; do
            echo "vcpkg install attempt ${attempt}/3"
            if $VCPKG_ROOT/vcpkg \
              install \
              --triplet x86-windows-static \
              --x-install-root="$VCPKG_ROOT/installed"; then
              install_succeeded=true
              break
            fi
            sleep $((attempt * 20))
          done

          if [ "$install_succeeded" != true ]; then
            find "${VCPKG_ROOT}/" -name "*.log" -print
            exit 1
          fi

      - name: Build Windows x86 Sciter client
        shell: bash
        run: |
          python3 res/inline-sciter.py

          # Ветка dyn_x86 и закреплённый commit соответствуют официальной сборке RustDesk 1.4.9.
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins

          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/rustdesk.exe
          curl --fail --show-error --location \
            --output ./Release/sciter.dll \
            https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll

          curl --fail --show-error --location \
            --output ./usbmmidd_v2.zip \
            https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip -q usbmmidd_v2.zip

          # x86-клиент сохраняет 64-bit helper: он нужен для установки драйвера на 64-bit Windows.
          rm -f ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release

      - name: Add embedded server configuration
        shell: pwsh
        run: |
          # Пишем без BOM, иначе legacy-клиент не сможет разобрать custom_.txt.
          $encoding = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'Release/custom_.txt'), $env:custom, $encoding)

      - name: Verify branding in unpacked x86 client
        shell: pwsh
        run: |
          $scriptUrl = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/scripts/verify_windows_branding.ps1"
          Invoke-WebRequest -Uri $scriptUrl -OutFile verify_windows_branding.ps1
          ./verify_windows_branding.ps1 `
            -RepositoryRoot (Get-Location).Path `
            -ExecutablePath 'Release/rustdesk.exe'

      - name: Build portable x86 executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/rustdesk.exe
          popd

          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${{ env.filename }}_x86.exe"

      - name: Verify final x86 executable
        shell: pwsh
        run: |
          $file = "SignOutput/${{ env.filename }}_x86.exe"
          ./verify_windows_branding.ps1 `
            -RepositoryRoot (Get-Location).Path `
            -ExecutablePath $file

          $version = (Get-Item -LiteralPath $file).VersionInfo
          if ($version.ProductName -ne '${{ env.appname }}') {
            throw "Unexpected ProductName: $($version.ProductName)"
          }
          if ($version.FileDescription -match 'RustDesk' -or $version.LegalCopyright -match 'Purslane') {
            throw "Legacy upstream metadata remains in the final executable"
          }

          Get-FileHash -LiteralPath $file -Algorithm SHA256

      - name: Upload Windows x86 portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: tehpult-windows-x86-portable
          path: SignOutput/${{ env.filename }}_x86.exe
          if-no-files-found: error
          retention-days: 7

  cleanup:
    name: Cleanup private configuration
    needs: [setup, build-x86]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Delete encrypted configuration artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: encrypted-secrets-zip
