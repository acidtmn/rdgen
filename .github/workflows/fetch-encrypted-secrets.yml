name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string
        default: ''
      config_b64:
        description: 'Base64-encoded generator configuration for a private manual run'
        required: false
        type: string
        default: ''
    secrets:
      zip_password:
        required: false

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Create encrypted configuration for a private run
        if: ${{ inputs.config_b64 != '' }}
        env:
          CONFIG_B64: ${{ inputs.config_b64 }}
          ZIP_PASSWORD: ${{ secrets.zip_password }}
        run: |
          python -m pip install --disable-pip-version-check pyzipper
          python - <<'PY'
          import base64
          import json
          import os
          import pyzipper

          password = os.environ['ZIP_PASSWORD']
          if not password:
              raise RuntimeError('ZIP_PASSWORD is required for an inline generator configuration')

          # Проверяем JSON до упаковки, чтобы сборка не использовала повреждённую конфигурацию.
          config = json.loads(base64.b64decode(os.environ['CONFIG_B64']).decode('utf-8'))
          with pyzipper.AESZipFile(
              'secrets.zip',
              'w',
              compression=pyzipper.ZIP_LZMA,
              encryption=pyzipper.WZ_AES,
          ) as archive:
              archive.setpassword(password.encode())
              archive.writestr('secrets.json', json.dumps(config, ensure_ascii=False))
          PY

      - name: Download with Retry
        if: ${{ inputs.config_b64 == '' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: python
          command: |
            import requests
            import json
            import time

            input_data = json.loads('${{ inputs.zip_url_json }}')
            url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
            
            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(url, timeout=20)
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else: raise e

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
